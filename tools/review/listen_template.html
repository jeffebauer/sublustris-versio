      <datalist id="blendnoon"><option value="50"></option></datalist>

<script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("rv-data").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chipHtml = c => `<span class="chip"><b>${esc(c.k)}</b> ${esc(c.v)}${c.c ? ` <i>${esc(c.c)}</i>` : ""}</span>`;
const VC = i => `var(--v${i % 8})`;
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0") : "0:00.0";
const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- state (localStorage is a convenience: Copy/Download are the record) ---------- */
let state = { picks: {}, notes: {}, overall: "", blind: {}, levelMatch: DATA.levelMatch, ref: "", blend: 50 };
try { const raw = localStorage.getItem(DATA.storeKey); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
const savedEl = $("saved");
const status = msg => { savedEl.textContent = msg; };
function save() {
  try { localStorage.setItem(DATA.storeKey, JSON.stringify(state)); status("Saved"); }
  catch (e) { status("Not saved in this browser: use Copy or Download before closing"); }
}

/* ---------- header ---------- */
$("title").textContent = DATA.title;
document.title = DATA.title;
// Showcase pages (DATA.choices false) show settings, they don't ask for a
// decision: no "My pick", no blind mode, no diagnostic flags, notes only.
const CHOICES = DATA.choices !== false;
$("lede").textContent = DATA.lede || (CHOICES ? "Compare the versions in each card and pick the one you prefer." : "");
const anyDry = DATA.rows.some(r => r.dry);
const howto = [
  "Press <b>Play</b> on any card. Only one card plays at a time; starting another stops the first.",
  "Click a version (or press <kbd>1</kbd>–<kbd>9</kbd>) while it plays: all versions in a card run in sync, so you hear only what changes. Switching crossfades, so there are no clicks.",
];
const BLEND = !!DATA.wetOnly && anyDry;   // versions are 100 % wet: the page mixes in the dry
if (BLEND) howto.push("<b>MIX</b> in the top bar sets dry/wet for every card, live, as the module's knob does (equal-power: 50 % is an even blend). Try a few balances: a tail can work at 30 % and swamp at 70 %.");
// With MIX, the fader already takes you to the dry (fully left), so there is no separate Dry version.
const SHOW_DRY = anyDry && !BLEND;
if (SHOW_DRY) howto.push("<b>Dry</b> (<kbd>0</kbd>) is the input alone, no reverb, for reference.");
howto.push("Cards in a row share one position: switch to another column and it carries on from the same moment.");
howto.push((DATA.rows.some(r => r.marks.length) ? "The bar under each picture is in chapters (hover for names): click one to jump there. " : "") +
  "<b>Drag across a picture</b> to loop just that stretch, in every card of the row; <kbd>Esc</kbd> stops looping.");
howto.push(CHOICES ? "Pick the version you prefer in each card, add notes, then <b>Copy results for Claude</b>."
                   : "Nothing to choose: notes are welcome per column, then <b>Copy notes for Claude</b>.");
$("howtolist").innerHTML = howto.map(h => `<li>${h}</li>`).join("");
if (!CHOICES) {
  $("blindwrap").hidden = true;
  $("copy").textContent = "Copy notes for Claude";
  $("download").textContent = "Download notes";
}
const ax = [];
if (DATA.axes.columns) ax.push("columns: " + DATA.colsTitle);
if (DATA.axes.rows) ax.push("rows: " + (DATA.axes.rows === "material" ? "the music played into it" : DATA.axes.rows));
if (DATA.axes.variants) ax.push("A, B, C… in a card: " + DATA.variantsTitle);
$("layout").textContent = ax.length ? ax.join(" · ") : "";
if (DATA.readme) { $("readme").hidden = false; $("readme").querySelector("pre").textContent = DATA.readme; }
if (DATA.fixed.length) $("fixed").innerHTML = `<span class="lab">Same for every file</span>` + DATA.fixed.map(chipHtml).join("");

const lmEl = $("levelmatch"), blindEl = $("blind"), loopEl = $("loop"), refEl = $("ref"), tailBoostEl = $("tailboost");
const hasRms = Object.values(DATA.items).some(it => it.rms != null);
if (!hasRms) $("lmwrap").hidden = true;
lmEl.checked = !!state.levelMatch && hasRms;
lmEl.parentElement.title = "Moves every version in a card towards the card's median loudness (at most ±" + (DATA.levelMatchCapDb || 12) +
  " dB), so none sounds better just by being louder. Off on pages where the loudness change is part of the setting.";
if (DATA.references.length) {
  $("refwrap").hidden = false;
  DATA.references.forEach(r => { const o = document.createElement("option"); o.value = r.id; o.textContent = r.name; refEl.appendChild(o); });
  if (DATA.references.some(r => r.id === state.ref)) refEl.value = state.ref;
}
const refById = id => DATA.references.find(r => r.id === id) || null;
// MIX: Immensio's law (core/params/Mappings.h mixGains, ADR 0012): dry cos, wet sin of v·π/2.
const blendEl = $("blend"), blendVal = $("blendval");
const blendGains = () => { const v = blendEl.value / 100; return { dry: Math.cos(v * Math.PI / 2), wet: Math.sin(v * Math.PI / 2) }; };

/* ---------- audio engine ----------
   Web Audio, so a card's versions play sample-locked from one clock, and every change is a fade:
   switching versions is a FADE-long equal-power crossfade; play, pause, seek and moving to another
   card fade in/out over EDGE. Buffers decode on demand and the least recently used are dropped. */
const FADE = 0.03, EDGE = 0.015, KEEP_BUFFERS = 18, KEEP_CARDS = 3;
const recent = [];                 // cards holding decoded audio, most recent first
let actx = null;
function audioCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
const bufCache = new Map();      // wav -> Promise<AudioBuffer>, in least-recently-used order
const waiting = new Map();       // wav -> resolve(base64), for _audio/*.js
window.__rvAudio = (wav, b64) => { const w = waiting.get(wav); if (w) { waiting.delete(wav); w(b64); } };
function b64ToArrayBuffer(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
// ?audio=js makes a served page load the _audio/*.js files too, as a page opened from Finder does.
const USE_JS = location.protocol === "file:" || /[?&]audio=js\b/.test(location.search) || !window.fetch;
function loadBytes(src) {
  if (src.audioJs && USE_JS) {
    return new Promise((resolve, reject) => {
      waiting.set(src.wav, b64 => resolve(b64ToArrayBuffer(b64)));
      const s = document.createElement("script");
      s.src = src.audioJs;
      s.onload = () => s.remove();
      s.onerror = () => { waiting.delete(src.wav); s.remove(); reject(new Error("missing " + src.audioJs)); };
      document.head.appendChild(s);
    });
  }
  return fetch(src.wav).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); });
}
function loadBuffer(src) {

    const vs = panel.variants.map(v => ({ v, ac: DATA.items[v.item].ac })).filter(x => x.ac);
    numbersEl.hidden = !vs.length || blindEl.checked;
    if (numbersEl.hidden) return;
    const hz = vs[0].ac.hz.map(h => h >= 1000 ? h / 1000 + "k" : String(h));
    const sec = x => x == null ? "–" : x >= 10 ? x.toFixed(0) : x.toFixed(1);
    const rows = (key, title) => `<tr><th>${title}</th>${hz.map(h => `<th>${h}</th>`).join("")}</tr>` + vs.map(({ v, ac }) => {
      const vals = ac[key], mid = vals.slice(2, 5).filter(x => x != null), ref = mid.length ? mid.reduce((a, b) => a + b) / mid.length : null;
      // A band ringing 30 % longer than the mids is what "one band hangs" sounds like.
      return `<tr><td>${esc(v.k)}</td>${vals.map(x => `<td${ref && x != null && x > 1.3 * ref ? ' class="hang"' : ""}>${sec(x)}</td>`).join("")}</tr>`;
    }).join("");
    const extra = vs.map(({ v, ac }) => `${esc(v.k)}: ` + [
      ac.dense != null ? `smooth after ${ac.dense.toFixed(2)} s` : "never fully smooth",
      ac.c80 != null ? `clarity ${ac.c80 > 0 ? "+" : ""}${ac.c80.toFixed(1)} dB` : "",
      ac.iacc != null ? `width ${(1 - ac.iacc).toFixed(2)}` : "",
      ac.flat != null ? `tail wobble ${ac.flat.toFixed(1)} dB` : ""].filter(Boolean).join(" · ")).join("<br>");
    numbersEl.querySelector(".scroll").innerHTML =
      `<table>${rows("t60", "Decay (s) by Hz")}${rows("edt", "Early decay (s)")}</table>${extra}` +
      `<div>Measured on one click through the same settings, so every row shows the same numbers. Bold: a band ringing 30 % longer than the mids. Smooth: how soon the tail is a wash, not separate echoes (target 0.3 s). Clarity: louder early sound is clearer. Width: 0 = mono, 1 = fully wide.</div>`;
  };

  // ---- picture: the selected version over time, the playhead, the loop ----
  let drag = null;
  g.drawSpec = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w) return;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    const ctx = canvas.getContext("2d"), src = g.sources()[g.sel];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let img = specImage(src), sp = img && src.spec.t1 > src.spec.t0 ? [src.spec.t0, src.spec.t1] : null;
    if (!img && g.bufs && g.bufs[g.sel]) { img = levelImage(src, g.bufs[g.sel]); sp = [0, g.bufs[g.sel].duration]; }
    if (!sp) sp = [0, g.duration() || 1];
    if (img) { ctx.imageSmoothingEnabled = true; ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
    else { ctx.fillStyle = "#888"; ctx.font = `${12 * dpr}px sans-serif`; ctx.fillText("press Play to load", 8 * dpr, 20 * dpr); }
    const X = t => (t - sp[0]) / (sp[1] - sp[0]) * canvas.width;
    const reg = drag && drag.moved ? [Math.min(drag.t0, drag.t1), Math.max(drag.t0, drag.t1)] : g.region;
    if (reg) {
      ctx.fillStyle = "rgba(255, 214, 102, 0.28)"; ctx.fillRect(X(reg[0]), 0, X(reg[1]) - X(reg[0]), canvas.height);
      ctx.fillStyle = "rgba(255, 214, 102, 0.9)"; ctx.fillRect(X(reg[0]), 0, dpr, canvas.height); ctx.fillRect(X(reg[1]) - dpr, 0, dpr, canvas.height);
    }
    // Chapter marks: a thin line and the chapter's name at the top.
    ctx.font = `${10.5 * dpr}px -apple-system, sans-serif`;
    chapters.forEach((c, i) => {
      if (i === 0 && !c[0]) return;
      const cx = X(c[1]);
      if (i > 0) { ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(cx, 0, dpr, canvas.height); }
      if (c[0]) {
        const tw = ctx.measureText(c[0]).width + 6 * dpr;
        ctx.fillStyle = "rgba(8,10,20,0.6)"; ctx.fillRect(cx + 2 * dpr, 2 * dpr, tw, 14 * dpr);
        ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fillText(c[0], cx + 5 * dpr, 12.5 * dpr);
      }
    });
    const x = X(g.position());
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillRect(Math.max(0, Math.min(canvas.width - 2 * dpr, x)), 0, 2 * dpr, canvas.height);
    g.specSpan = sp;
  };
  const timeAt = e => {
    const r = canvas.getBoundingClientRect(), sp = g.specSpan || [0, g.duration() || 0];
    return sp[0] + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (sp[1] - sp[0]);
  };
  canvas.addEventListener("pointerdown", e => {
    current = g; canvas.setPointerCapture(e.pointerId);
    drag = { t0: timeAt(e), t1: timeAt(e), x0: e.clientX, moved: false };
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.t1 = timeAt(e); drag.moved = drag.moved || Math.abs(e.clientX - drag.x0) > 4;
    g.drawSpec();
  });
  canvas.addEventListener("pointerup", e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) { g.setRegion([Math.min(d.t0, d.t1), Math.max(d.t0, d.t1)]); if (!g.playing) g.play(); }
    else { g.seek(d.t0); if (!g.playing) g.play(); }
  });

  playBtn.addEventListener("click", () => { current = g; if (g.wantPlay) return; g.playing ? g.pause() : g.play(); });
  // The chapter bar: segments sized by each chapter's length. A click jumps (snapping to a chapter's
  // start when close to it), a drag scrubs; hovering shows the chapter's name.
  const chapEnd = i => (i + 1 < chapters.length ? chapters[i + 1][1] : g.duration() || chapters[i][1] + 1);
  g.layoutChapters = () => {
    const d = g.duration();
    if (!d || g.laidOut === d) return;
    g.laidOut = d;
    chapSegs.forEach((el, i) => { el.style.flexGrow = Math.max(0.01, chapEnd(i) - chapters[i][1]); });
  };
  const timeAtBar = e => {
    // Segments are laid out by length (with small gaps), so find the one under the pointer.
    const x = e.clientX;
    for (let i = 0; i < chapSegs.length; i++) {
      const r = chapSegs[i].getBoundingClientRect();
      if (x <= r.right + 1.5 || i === chapSegs.length - 1) {
        const f = Math.max(0, Math.min(1, (x - r.left) / r.width)), a = chapters[i][1], b = chapEnd(i);
        return f < 0.03 ? a : a + f * (b - a);
      }
    }
    return 0;
  };
  let barDrag = false, lastBar = 0;
  chapEl.addEventListener("pointerdown", e => {
    current = g; barDrag = true; chapEl.setPointerCapture(e.pointerId);
    g.seek(timeAtBar(e)); if (!g.playing) g.play();
  });
  chapEl.addEventListener("pointermove", e => {
    if (!barDrag) return;
    const now = performance.now();
    if (now - lastBar < 60) return; // don't restart the audio on every pixel of a drag
    lastBar = now; g.seek(timeAtBar(e));
  });
  chapEl.addEventListener("pointerup", () => { barDrag = false; });
  chapEl.addEventListener("keydown", e => {
    const i = chapterAt(g.position());
    if (e.key === "ArrowRight" && i + 1 < chapters.length) { g.seek(chapters[i + 1][1]); e.preventDefault(); e.stopPropagation(); }
    if (e.key === "ArrowLeft") { g.seek(chapters[Math.max(0, g.position() - chapters[i][1] < 1 ? i - 1 : i)][1]); e.preventDefault(); e.stopPropagation(); }
  });
  const chapterAt = t => { let i = 0; while (i + 1 < chapters.length && chapters[i + 1][1] <= t) i++; return i; };
  cell.addEventListener("pointerdown", () => { current = g; });
  // Start decoding as soon as the pointer reaches a card, so Play starts at once.
  const warm = () => { if (actx || navigator.userActivation && navigator.userActivation.hasBeenActive) g.ensureLoaded(); };
  cell.addEventListener("pointerenter", warm);
  cell.addEventListener("focusin", warm);

  g.tick = () => {
    const d = g.duration();
    if (g.playing && !loopEl.checked && !g.region && d && g.position() >= d) { g.pause(); g.pos = 0; }
    const p = g.position(), live = !!rowPlaying();
    g.layoutChapters();
    if (live || !g.drawn || g.lastP !== p) {
      g.lastP = p;
      timeEl.textContent = fmt(p) + (d ? " / " + fmt(d) : "");
      const ci = chapterAt(p);
      chname.textContent = chapters.length > 1 || chapters[0][0] ? (chapters[ci][0] || "Start") : "";
      chapSegs.forEach((el, i) => {
        const a = chapters[i][1], b = chapEnd(i);
        el.firstChild.style.width = (100 * Math.max(0, Math.min(1, (p - a) / Math.max(1e-6, b - a)))) + "%";
      });
      if (d) chapEl.setAttribute("aria-valuenow", Math.round(100 * p / d));
      g.drawSpec(); g.drawn = !!canvas.clientWidth;
    }
  };
  g.render();
  return g;
}

const rowsEl = $("rows");
DATA.rows.forEach(row => {
  const sec = document.createElement("section");
  sec.className = "row";
  const head = row.name || row.note ? `<div class="rowhead">${row.name ? `<h2>${esc(row.name)}</h2>` : ""}${row.note ? `<span class="note">${esc(row.note)}</span>` : ""}</div>` : "";
  sec.innerHTML = head + `<div class="cols${NCOLS === 1 ? " single" : ""}"></div>`;
  const cols = sec.querySelector(".cols");
  cols.style.setProperty("--ncols", Math.min(NCOLS, 4));
  DATA.cols.forEach(col => {
    const key = row.id + "|" + col.id, panel = DATA.panels[key];
    if (!panel) {
      const e = document.createElement("div"); e.className = "cell empty"; e.textContent = "no render for " + (col.name || "this card");
      cols.appendChild(e); return;
    }
    const g = makeGroup(row, col, panel, key);
    groups.push(g); cols.appendChild(g.el);
  });
  rowsEl.appendChild(sec);
});
current = groups[0] || null;

/* ---------- legend and the global switch ---------- */
if (DATA.legend) {
  DATA.legend.forEach((v, i) => {
    const d = document.createElement("div");
    d.style.setProperty("--vc", VC(i));
    d.innerHTML = `<b>${esc(v.k)}${v.n ? " · " + esc(v.n) : ""}</b>${esc(v.d || "")}`;
    $("legend").appendChild(d);
  });
} else $("legend").hidden = true;

const globalEl = $("global");
function renderGlobal() {
  globalEl.innerHTML = "";
  const labels = [];
  for (let i = 0; i < maxVariants; i++) labels.push(DATA.legend ? DATA.legend[i].k : "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i] || String(i + 1));
  const all = [];
  const add = (label, color, title, pick) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.title = title; b.style.setProperty("--vc", color);
    b.addEventListener("click", () => { groups.forEach(pick); all.forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false")); });
    globalEl.appendChild(b); all.push(b);
    return b;
  };
  labels.forEach((lab, i) => add(blindEl.checked ? "#" + (i + 1) : lab, VC(i),
    blindEl.checked ? "position " + (i + 1) + " in every card" : (DATA.legend && DATA.legend[i].n) || "version " + lab + " in every card",
    g => { if (i < g.order.length) g.select(blindEl.checked ? g.order[i] : i); }));
  if (SHOW_DRY) add("Dry", "var(--dry)", "the dry input in every card", g => g.select(g.panel.variants.length));
  if (DATA.references.length) {
    const b = add("R", "var(--ref)", "the reference in every card", g => { if (g.ref) g.select(g.panel.variants.length + 1); });
    b.hidden = !refEl.value;
  }
}
renderGlobal();
if (maxVariants < 2 && !DATA.references.length && !SHOW_DRY) globalEl.parentElement.querySelector(".tlabel").hidden = globalEl.hidden = true;

/* ---------- notes ---------- */
const notesEl = $("notes");
notesEl.style.setProperty("--ncols", Math.min(NCOLS, 4));
if (NCOLS === 1) notesEl.classList.add("single");
$("notesnote").textContent = (NCOLS > 1 ? "one box per column · " : "") + "saved as you type";
DATA.cols.forEach(col => {
  const d = document.createElement("div");
  d.style.setProperty("--ac", `var(${col.color})`);
  const lab = col.name || "Notes";
  d.innerHTML = `<div class="notelab">${esc(lab)}</div><textarea placeholder="${esc(lab)}: what you hear, what you'd change"></textarea>`;
  const ta = d.querySelector("textarea");
  ta.value = state.notes[col.id] || "";
  ta.addEventListener("input", () => { state.notes[col.id] = ta.value; save(); });
  notesEl.appendChild(d);
});
const overallEl = $("overall");
overallEl.value = state.overall || "";
overallEl.addEventListener("input", () => { state.overall = overallEl.value; save(); });

/* ---------- results ---------- */
function results() {
  const lines = [`${DATA.title}: ${CHOICES ? "my picks and notes" : "my notes"}`, `Page: ${DATA.source}/${DATA.page}`];
  if (ax.length) lines.push("Layout: " + ax.join(" · "));
  if (lmEl.checked) lines.push("Listened level-matched.");
  if (BLEND) lines.push("Listened at MIX " + blendEl.value + " % (moved while listening: notes may cover other balances).");
  if (refEl.value) lines.push("Compared with reference: " + (refById(refEl.value) || {}).name);
  lines.push("");
  // The hidden twin (make_review.py): a repeated row whose two copies must agree for a pick to count.
  const pickedItem = (rowId, col) => {
    const k = rowId + "|" + col.id, p = state.picks[k], panel = DATA.panels[k];
    return p == null || !panel ? null : panel.variants[p];
  };
  const twinVerdict = (row, col) => {
    const twin = DATA.rows.find(r => r.twinOf === row.id);
    if (!twin) return "";
    const a = pickedItem(row.id, col), b = pickedItem(twin.id, col);
    if (!a || !b) return " (repeated card: pick both copies)";
    return a.item === b.item ? " (repeated card: same pick both times)"
                             : ` (repeated card: picked ${b.k || b.n} the other time, so no clear preference)`;
  };
  if (CHOICES) DATA.rows.forEach(row => {
    if (row.twinOf) return;
    const inRow = DATA.cols.filter(col => DATA.panels[row.id + "|" + col.id] && DATA.panels[row.id + "|" + col.id].variants.length > 1);
    if (!inRow.length) return;
    const indent = row.name ? "- " : "";
    if (row.name) lines.push(`${row.name}:`);
    inRow.forEach(col => {
      const k = row.id + "|" + col.id, p = state.picks[k], panel = DATA.panels[k];
      const v = p == null ? null : panel.variants[p];
      const what = v ? [v.k, v.n].filter(Boolean).join(", ") : "no pick";
      lines.push(`${indent}${col.name ? col.name + ": " : "My pick: "}${what}${v && state.blind[k] ? " (picked blind)" : ""}${twinVerdict(row, col)}`);
    });
  });
  const notes = DATA.cols.map(col => [col, (state.notes[col.id] || "").trim()]).filter(x => x[1]);
  if (notes.length) { lines.push(""); notes.forEach(([col, n]) => lines.push(`${col.name ? col.name + " notes" : "Notes"}: ${n}`)); }
  if ((state.overall || "").trim()) { lines.push(""); lines.push(`Overall: ${state.overall.trim()}`); }
  return lines.join("\n");
}
$("copy").addEventListener("click", async () => {
  const text = results();
  try { await navigator.clipboard.writeText(text); status("Copied: paste it into the chat"); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    status(ok ? "Copied: paste it into the chat" : "Copy blocked: use Download");
  }
});
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([results()], { type: "text/plain" }));
  a.download = (DATA.title || "review").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-feedback.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ---------- toggles ---------- */
blindEl.addEventListener("change", () => {
  groups.forEach(g => { g.order = blindEl.checked ? shuffled(g.panel.variants.map((_, i) => i)) : g.panel.variants.map((_, i) => i); g.render(); });
  renderGlobal();
});
lmEl.addEventListener("change", () => { state.levelMatch = lmEl.checked; save(); groups.forEach(g => g.render()); });
loopEl.addEventListener("change", () => groups.forEach(g => g.restart()));
if (DATA.rows.some(r => r.tail != null)) {
  $("tailboostwrap").hidden = false;
  tailBoostEl.checked = !!state.tailBoost;
  tailBoostEl.addEventListener("change", () => {
    state.tailBoost = tailBoostEl.checked; save();
    groups.forEach(g => { if (g.tailMode) g.restart(); });
  });
}
function showBlend() { blendVal.textContent = blendEl.value + " %"; }
if (BLEND) {
  $("blendwrap").hidden = false;
  blendEl.value = state.blend != null ? state.blend : 50;
  showBlend();
  blendEl.addEventListener("input", () => { showBlend(); groups.forEach(g => g.applyBlend()); });
  blendEl.addEventListener("change", () => { state.blend = +blendEl.value; save(); });
}
refEl.addEventListener("change", () => {
  state.ref = refEl.value; save();
  const r = refById(refEl.value);
  groups.forEach(g => g.setRef(r));
  renderGlobal();
});
if (refEl.value) groups.forEach(g => g.setRef(refById(refEl.value)));
(function frame() { groups.forEach(g => g.tick()); requestAnimationFrame(frame); })();
window.__rvReview = { groups, audioContext: () => actx }; // for tools/review tests and debugging
window.addEventListener("resize", () => groups.forEach(g => g.drawSpec()));

/* ---------- keys ---------- */
const nk = Math.min(9, maxVariants);
$("keys").innerHTML = `Keys, on the card you last touched: ${nk > 1 ? `<kbd>1</kbd>–<kbd>${nk}</kbd> switch version · ` : ""}` +
  `${SHOW_DRY ? "<kbd>0</kbd> dry · " : ""}${DATA.references.length ? "<kbd>R</kbd> the reference · " : ""}<kbd>Space</kbd> play/pause · ` +
  `<kbd>←</kbd> <kbd>→</kbd> 2 s back/forward · ${BLEND ? "<kbd>[</kbd> <kbd>]</kbd> MIX −/+ 5 % · " : ""}` +
  `${DATA.rows.some(r => r.loud.length) ? "<kbd>L</kbd> next loud moment · " : ""}` +
  `${DATA.rows.some(r => r.tail != null) ? "<kbd>T</kbd> loop the tail · " : ""}<kbd>Esc</kbd> stop looping · <kbd>Tab</kbd> between buttons.`;
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (!current || tag === "input" || tag === "textarea" || tag === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
  const g = current, n = g.panel.variants.length;
  if (e.key >= "1" && e.key <= "9") {
    const pos = +e.key - 1;
    if (pos < g.order.length) { g.select(g.order[pos]); e.preventDefault(); }
  } else if (e.key === "0" && g.row.dry && SHOW_DRY) { g.select(n); e.preventDefault(); }
  else if ((e.key === "r" || e.key === "R") && g.ref) { g.select(n + 1); e.preventDefault(); }
  else if (e.key === " ") { g.playing ? g.pause() : g.play(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { g.seek(g.position() - 2); e.preventDefault(); }
  else if (e.key === "ArrowRight") { g.seek(g.position() + 2); e.preventDefault(); }
  else if (e.key === "Escape") g.setRegion(null);
  else if ((e.key === "t" || e.key === "T") && g.row.tail != null) { g.toggleTail(); e.preventDefault(); }
  else if (BLEND && (e.key === "[" || e.key === "]")) {
    blendEl.value = Math.max(0, Math.min(100, +blendEl.value + (e.key === "]" ? 5 : -5)));
    showBlend(); groups.forEach(o => o.applyBlend()); state.blend = +blendEl.value; save(); e.preventDefault();
  }
  else if ((e.key === "l" || e.key === "L") && g.row.loud.length) {
    const t = g.position(), loud = g.row.loud;
    const next = loud.find(x => x - 0.2 > t + 0.5);
    g.seek(Math.max(0, (next != null ? next : loud[0]) - 0.2)); if (!g.playing) g.play();
  }
});
})();
</script>
</body>
</html>
